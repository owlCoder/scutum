name: CI

# Globalni CI (GitHub čita workflow-e samo iz ovog foldera). Logiku testiranja ne piše CI nego svaki tim:
# CI samo pokreće 'tests' profil iz services/<tNN>-*/docker-compose.yml za izmenjene AKTIVNE servise.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/check-structure.sh

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/check-secrets.sh

  detect:
    name: detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.changed.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: echo "services=$(bash scripts/ci/changed-services.sh "$BASE_SHA" HEAD)" >> "$GITHUB_OUTPUT"

  service-tests:
    name: tests (${{ matrix.service }})
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Testovi servisa
        env:
          SERVICE: ${{ matrix.service }}
        run: bash scripts/scutum.sh test "$SERVICE"
      - name: Dokazi (TestResults)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}-*/TestResults/
          if-no-files-found: ignore

  # Jedna provera koju treba tražiti kao "required" u branch protection-u.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [structure, secrets, service-tests]
    runs-on: ubuntu-latest
    steps:
      - env:
          STRUCTURE: ${{ needs.structure.result }}
          SECRETS: ${{ needs.secrets.result }}
          TESTS: ${{ needs.service-tests.result }}
        run: |
          echo "structure=$STRUCTURE secrets=$SECRETS service-tests=$TESTS"
          [ "$STRUCTURE" = success ] && [ "$SECRETS" = success ] && { [ "$TESTS" = success ] || [ "$TESTS" = skipped ]; }
