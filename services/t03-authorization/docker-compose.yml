name: scutum-t03
services:
  # Health scaffold; ne izlaže zaštićene podatke niti Read endpoint.
  t03-api:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${API_PORT:?kopirajte .env.example u .env}:8080"
    networks: [default, scutum-net]
  t03-tests:
    profiles: [tests]
    build:
      context: .
      target: test
    volumes:
      - ./TestResults:/results
    networks: [default]
  t03-tests-static:
    profiles: [tests]
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    command: ["python", "scripts/check_source.py"]
    networks: [default]
networks:
  scutum-net:
    external: true
    name: scutum-net
