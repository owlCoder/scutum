# T10 — Log izvori, telemetry ingestion i detection tuning
# Razvojni compose. Zadržava konvencije iz README.md u korenu repoa: ime projekta, imena servisa,
# portove (samo 127.0.0.1), mrežu scutum-net samo za api i profil 'tests'.
name: scutum-t10

services:
  t10-api:                            # .NET 10 Web API (src/backend)
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # razvojno okruženje: OpenAPI na /openapi/v1.json
      # Konekcija za EF Core (ConnectionStrings:T10); lozinka dolazi iz .env, nije u kodu.
      ConnectionStrings__T10: "Host=${DB_HOST:?kopirajte .env.example u .env};Port=${DB_PORT:?kopirajte .env.example u .env};Database=${DB_NAME:?kopirajte .env.example u .env};Username=${DB_USER:?kopirajte .env.example u .env};Password=${DB_PASSWORD:?kopirajte .env.example u .env}"
      # T04_BASE_URL: ${T04_BASE_URL:-http://t04-api:8080}
    ports:
      - "127.0.0.1:${API_PORT:?kopirajte .env.example u .env}:8080"
    depends_on:
      t10-db:
        condition: service_healthy
    networks: [default, scutum-net]   # jedino api je vidljiv ostalim timovima

  t10-ui:                             # Next.js frontend (BFF): sa API-jem razgovara samo server, preko privatne mreže
    build:
      context: ./src/frontend
      target: runtime
    environment:
      T10_API_BASE_URL: ${T10_API_BASE_URL:?kopirajte .env.example u .env}
    ports:
      - "127.0.0.1:${UI_PORT:?kopirajte .env.example u .env}:3000"
    depends_on: [t10-api]
    networks: [default]               # UI nije na scutum-net: drugi timovi koriste API, ne UI

  t10-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?kopirajte .env.example u .env}
      POSTGRES_USER: ${DB_USER:?kopirajte .env.example u .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?kopirajte .env.example u .env}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:?kopirajte .env.example u .env}:5432"   # samo za vaš alat (DBeaver, pgAdmin...)
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [default]               # baza NIJE na scutum-net: tuđi servisi je ne vide

  # Testovi (profil 'tests'; pokreće ih scutum.sh test i CI u izolovanom projektu scutum-t10-test).
  t10-tests-api:
    profiles: [tests]
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      target: test
    environment:
      ConnectionStrings__T10: "Host=${DB_HOST:?kopirajte .env.example u .env};Port=${DB_PORT:?kopirajte .env.example u .env};Database=${DB_NAME:?kopirajte .env.example u .env};Username=${DB_USER:?kopirajte .env.example u .env};Password=${DB_PASSWORD:?kopirajte .env.example u .env}"
    volumes:
      - ./TestResults:/results          # .trx rezultati; CI ih uploaduje kao dokaz
    depends_on:
      t10-db:
        condition: service_healthy
    networks: [default]

  t10-tests-ui:
    profiles: [tests]
    build:
      context: ./src/frontend
      target: test
    volumes:
      - ./TestResults:/results          # JUnit XML (frontend-junit.xml); CI ga uploaduje kao dokaz
    networks: [default]

  # Opciono: stub servisa od kog zavisite (profil 'stubs'), npr. WireMock/Mockoon nad OpenAPI iz contracts/
  # t10-stub-t04:
  #   profiles: [stubs]
  #   image: wiremock/wiremock:3.9.1
  #   volumes: ["./stubs/t04:/home/wiremock"]
  #   networks:
  #     scutum-net: { aliases: [t04-api] }   # ne pokretati zajedno sa pravim t04 servisom

networks:
  scutum-net:
    external: true
    name: scutum-net

volumes:
  db-data:
